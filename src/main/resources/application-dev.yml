spring:
  application:
    name: komunas-app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_GATEWAY_URL:localhost}:${KEYCLOAK_GATEWAY_PORT:8281}/realms/Linqra
          jwk-set-uri: http://${KEYCLOAK_GATEWAY_URL:localhost}:${KEYCLOAK_GATEWAY_PORT:8281}/realms/Linqra/protocol/openid-connect/certs
          validation:
            # Allow both internal and external issuer URLs
            allowed-issuers:
              - http://${KEYCLOAK_GATEWAY_URL:localhost}:${KEYCLOAK_GATEWAY_PORT:8281}/realms/Linqra
              - http://localhost:8281/realms/Linqra
  data:
    mongodb:
      uri: ${MONGO_GATEWAY_URL:mongodb://root:mongopw@localhost:27017,localhost:27018,localhost:27019/?replicaSet=rs0&authSource=admin&readConcernLevel=majority}
      database: Komunas
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
server:
  port: 0
  http2:
    enabled: true
  ssl:
    enabled: true
    key-store: ${CLIENT_KEY_STORE}
    key-store-password: ${CLIENT_KEY_STORE_PASSWORD}
    key-alias: ${CLIENT_ALIAS_NAME:client-app}
    key-store-type: PKCS12
    trust-store: ${CLIENT_TRUST_STORE}
    trust-store-password: ${CLIENT_TRUST_STORE_PASSWORD}
    trust-store-type: JKS
    client-auth: want
  servlet:
    context-path: /r/komunas-app

gateway:
  base-url: https://${GATEWAY_SERVICE_URL:localhost}:7777
  uscis-form-monitor-agent-id: 69aa4f948626a22133fff864
  uscis-newsroom-monitor-agent-id: 69fa94bf1119975a07e35aec
  uscis-processing-time-agent-id: 6a037080289c06263a4b2fb5

logging:
  file:
    name: logs/komunas-app.log
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.security.oauth2.client: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO
    com.fasterxml.jackson: DEBUG
    javax.net.ssl: OFF

eureka:
  client:
    service-url:
      defaultZone: https://${EUREKA_CLIENT_URL:localhost}:8761/eureka/eureka/
    enabled: true
    register-with-eureka: true
    fetch-registry: true
  instance:
    appname: komunas-app
    hostname: ${EUREKA_INSTANCE_URL:localhost}
    instance-id: ${spring.application.name}:${instanceId:${random.value}}
    non-secure-port-enabled: false   # Disable non-secure HTTP port
    secure-port-enabled: true        # Enable secure HTTPS port
    secure-port: ${server.port}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: true

whatsapp:
  verify:
    token: "linqra_whatsapp_webhook_token"
  app:
    id: "1296802635215629"
    secret: "dc0e4310d71a0e24112cca39180e3f4d"
    name: "Komunas"
    businessid: "763753579930598"
registration:
  default-roles:
    - "USER"
    - "gateway_admin_realm"
    - "gateway_admin"
  welcome-from: "noreply@linqra.com"
  welcome-bcc:
    - "msen@linqra.com"

demo-request:
  recipient: "msen@linqra.com"
  from: "noreply@linqra.com"

uscis:
  scraper:
    headless: false
