apiVersion: apps/v1
kind: Deployment
metadata:
  name: komunas-backend
  namespace: linqra
  labels:
    app: komunas-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: komunas-backend
  template:
    metadata:
      labels:
        app: komunas-backend
    spec:
      containers:
        - name: komunas-backend
          image: 945104357909.dkr.ecr.us-west-2.amazonaws.com/komunas-backend:latest
          ports:
            - containerPort: 8082
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "ec2"
            - name: USCIS_SCRAPER_HEADLESS
              value: "false"
            - name: CLIENT_TRUST_STORE
              value: "/app/client-truststore.jks"
            - name: CLIENT_TRUST_STORE_PASSWORD
              value: "123456"
            - name: CLIENT_KEY_STORE
              value: "/app/client-keystore.jks"
            - name: CLIENT_KEY_STORE_PASSWORD
              value: "123456"
            - name: CLIENT_ALIAS_NAME
              value: "komunas-app-container"
            - name: EUREKA_INSTANCE_URL
              value: "komunas-app"  # K8s service name, matches cert CN!
            - name: GATEWAY_SERVICE_URL
              value: "api-gateway-service"
            - name: EUREKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: komunas-secrets
                  key: eureka-username
            - name: EUREKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: komunas-secrets
                  key: eureka-password
            - name: MONGO_DB_URI
              valueFrom:
                secretKeyRef:
                  name: komunas-secrets
                  key: mongo-uri
            - name: SERVER_PORT
              value: "8082"
            - name: SERVER_SSL_ENABLED
              value: "true"
          livenessProbe:
            httpGet:
              path: /r/komunas-app/health
              port: 8082
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /r/komunas-app/health
              port: 8082
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: komunas-app
  namespace: linqra
spec:
  selector:
    app: komunas-backend
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komunas-frontend
  namespace: linqra
  labels:
    app: komunas-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: komunas-frontend
  template:
    metadata:
      labels:
        app: komunas-frontend
    spec:
      containers:
        - name: frontend
          image: 945104357909.dkr.ecr.us-west-2.amazonaws.com/komunas-frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: komunas-frontend-service
  namespace: linqra
  annotations:
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  selector:
    app: komunas-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP